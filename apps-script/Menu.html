<!-- Shared hamburger menu. Included by Index.html and Quote.html via include('Menu', {appUrl, page}).
     The page provides the button: <button class="hamb" id="menuBtn" aria-label="Menu">…</button> -->
<style>
  .hamb{flex:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:0;cursor:pointer}
  .hamb i{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink)}
  .drawer-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
  .drawer{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82vw;background:var(--card);border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;z-index:31;padding:20px 14px;display:flex;flex-direction:column;gap:6px}
  body.menu-open .drawer{transform:none}
  body.menu-open .drawer-bg{opacity:1;pointer-events:auto}
  .drawer-title{font-family:Oswald,Impact,sans-serif;font-weight:600;font-size:21px;text-transform:uppercase;letter-spacing:.5px;margin:0 6px 14px}
  .drawer-title span{color:var(--gold)}
  .drawer a{display:flex;align-items:center;gap:10px;padding:13px 12px;border-radius:12px;color:var(--ink);text-decoration:none;font:600 16px Inter,sans-serif;border:1px solid transparent}
  .drawer a.on{background:var(--card2);border-color:var(--blue)}
  .drawer a small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
</style>
<div class="drawer-bg" id="drawerBg"></div>
<nav class="drawer" id="drawer" aria-label="Pages">
  <div class="drawer-title">Let's <span>Wrassle</span></div>
  <a href="<?= appUrl ?>" target="_top" class="<?= page === 'leads' ? 'on' : '' ?>"><span>📋</span><span>Leads<small>Review, send and follow up</small></span></a>
  <a href="<?= appUrl ?>?page=quote" target="_top" class="<?= page === 'quote' ? 'on' : '' ?>"><span>🧮</span><span>Quote calculator<small>Price bulk custom orders</small></span></a>
</nav>
<script>
(function(){
  const open = on => document.body.classList.toggle('menu-open', on);
  const btn = document.getElementById('menuBtn');
  if (btn) btn.addEventListener('click', ev => { ev.stopPropagation(); open(!document.body.classList.contains('menu-open')); });
  document.getElementById('drawerBg').addEventListener('click', () => open(false));
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') open(false); });
})();
</script>
